name: vpn_agent_app
description: "StarLink VPN Agent App"
publish_to: 'none' 
version: 3.0.0+11

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter

  # ⭐️ Bloc State Management အတွက် ဒီ ၂ ခု လိုပါတယ် (ဖြည့်ထားပေးတယ်)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Utils
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  provider: ^6.1.5+1
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.3.2
  font_awesome_flutter: ^10.10.0
  badges: ^3.1.2
  lottie: ^3.3.2
  intl: ^0.20.2
  liquid_glass_renderer: ^0.1.1-dev.10
  tuple: ^2.0.2
  iconsax: ^0.0.8
  shared_preferences: ^2.5.3
  flutter_launcher_icons: ^0.14.1
  flutter_spinkit: ^5.2.2
  flutter_screenutil: ^5.9.3
  image_picker: ^1.2.1
  uuid: ^4.5.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  web_socket_channel: ^3.0.3
  firebase_remote_config: ^5.5.0
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true 

  assets:
    - assets/animations/
    - assets/images/
    # Subdirectories are not implied by the parent entry; each must be listed.
    - assets/images/avatars/
    # လိုအပ်ရင် ပုံတွေအတွက် path ထပ်ဖြည့်ပါ
    # - assets/images/ 

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  # The artwork carries its own pale backdrop rather than transparency, so
  # nothing needs flattening for iOS — it rejects icons with an alpha channel
  # at submission and rounds the corners itself.
  remove_alpha_ios: true
  background_color_ios: "#F2F3F5"

flutter_native_splash:
  # Generated rather than hand-written. values-v31/styles.xml was maintained by
  # hand, so every icon change meant three edits and a set of manually scaled
  # mipmaps.
  color: "#F2F3F5"
  image: assets/icon/splash.png

  android_12:
    # Android 12 masks a 240dp circle out of the 288dp slot; the package sizes
    # the asset for that, where a full-bleed image would be clipped.
    image: assets/icon/splash.png
    color: "#F2F3F5"

  android: true
  ios: true
  web: false
